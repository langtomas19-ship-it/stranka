<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pôjdeš so mnou von?</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf6f0;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, #fce4ec 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, #fce4ec 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, #fff3e0 0%, transparent 70%);
    z-index: 0;
  }

  .petals-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .petal {
    position: absolute;
    opacity: 0;
    animation: fall linear infinite;
    font-size: 14px;
  }

  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0.7; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .card-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 420px;
    padding: 1rem;
  }

  .main-card {
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(18px);
    border-radius: 24px;
    border: 1px solid rgba(255,182,193,0.4);
    box-shadow: 0 8px 48px rgba(233,30,99,0.08), 0 2px 12px rgba(0,0,0,0.06);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    /* NO overflow:hidden so dodge stays inside but visible */
    position: relative;
  }

  .heart-deco {
    font-size: 2rem;
    margin-bottom: 0.75rem;
    display: block;
    animation: heartbeat 2s ease-in-out infinite;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15%      { transform: scale(1.18); }
    30%      { transform: scale(1); }
    45%      { transform: scale(1.1); }
    60%      { transform: scale(1); }
  }

  h1.question {
    font-family: 'Playfair Display', serif;
    font-size: 1.9rem;
    font-weight: 700;
    color: #b5294e;
    line-height: 1.25;
    margin-bottom: 0.5rem;
    letter-spacing: -0.3px;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #c77;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    font-weight: 300;
  }

  /* Buttons row — fixed height so "No" can roam inside it */
  .buttons-area {
    position: relative;
    height: 120px;
  }

  /* Yes button — starts centered-left, expands on first move */
  #btnYes {
    background: linear-gradient(135deg, #e91e63, #c2185b);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 0.75rem 2.2rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.05rem;
    font-style: italic;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(233,30,99,0.3);
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% - 58px), -50%);
    transition: transform 0.18s, box-shadow 0.18s, padding 0.3s;
    white-space: nowrap;
    z-index: 2;
  }

  #btnYes.expanded {
    padding: 0.75rem 3rem;
  }

  #btnYes:hover {
    box-shadow: 0 8px 24px rgba(233,30,99,0.38);
  }

  #btnYes:active { transform: translate(calc(-50% - 58px), -50%) scale(0.97); }

  /* No button — starts right of Yes, then moves freely */
  #btnNo {
    background: transparent;
    color: #c77;
    border: 1.5px solid #f8bbd0;
    border-radius: 50px;
    padding: 0.7rem 1.6rem;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    cursor: default;
    user-select: none;
    white-space: nowrap;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(16px, -50%);
    transition: left 0.13s cubic-bezier(.22,1,.36,1), top 0.13s cubic-bezier(.22,1,.36,1);
    z-index: 1;
  }

  /* -- SLIDE PANELS -- */
  .slide-panel { display: none; }

  .slide-panel.active {
    display: block;
    animation: slideUp 0.45s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: #b5294e;
    margin-bottom: 0.3rem;
    font-style: italic;
  }

  .panel-sub {
    font-size: 0.82rem;
    color: #c77;
    margin-bottom: 1.4rem;
    letter-spacing: 0.04em;
  }

  .form-label {
    font-size: 0.8rem;
    color: #a05;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 0.3rem;
    display: block;
    text-align: left;
  }

  .form-control {
    border: 1.5px solid #f8bbd0;
    border-radius: 12px;
    background: #fff9fb;
    color: #7a1034;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    padding: 0.55rem 0.9rem;
    width: 100%;
    margin-bottom: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-control:focus {
    border-color: #e91e63;
    box-shadow: 0 0 0 3px rgba(233,30,99,0.1);
  }

  .btn-submit {
    width: 100%;
    background: linear-gradient(135deg, #e91e63, #c2185b);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 0.75rem;
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-style: italic;
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.2s;
    box-shadow: 0 4px 16px rgba(233,30,99,0.3);
    margin-top: 0.3rem;
  }

  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(233,30,99,0.35); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .processing-panel { padding: 1rem 0 0.5rem; }

  .processing-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: 1rem;
    animation: spin 2s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .processing-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: #b5294e;
    font-style: italic;
    margin-bottom: 0.5rem;
  }

  .processing-sub { font-size: 0.82rem; color: #c77; letter-spacing: 0.05em; }

  .error-msg { font-size: 0.82rem; color: #c0392b; margin-top: 0.5rem; display: none; }

  .steps { display: flex; justify-content: center; gap: 6px; margin-bottom: 1.2rem; }

  .step-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #f8bbd0;
    transition: background 0.3s;
  }

  .step-dot.active { background: #e91e63; }

  input[type="date"], input[type="time"] { color-scheme: light; }
</style>
</head>
<body>

<div class="petals-bg" id="petals"></div>

<div class="card-wrap">
  <div class="main-card" id="mainCard">

    <!-- PANEL 1: The question -->
    <div id="panel1">
      <span class="heart-deco">🌸</span>
      <h1 class="question">Pôjdeš so mnou von?</h1>
      <p class="subtitle">čakám na tvoju odpoveď&hellip;</p>

      <div class="buttons-area" id="buttonsArea">
        <button id="btnYes" onclick="showCalendar()">Áno ✨</button>
        <button id="btnNo">Nie</button>
      </div>
    </div>

    <!-- PANEL 2: Calendar -->
    <div id="panel2" class="slide-panel">
      <div class="steps">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
      </div>
      <p class="panel-title">Kedy sa stretneme? 🗓</p>
      <p class="panel-sub">Vyber dátum a čas.</p>

      <label class="form-label" for="dateInput">Dátum</label>
      <input type="date" class="form-control" id="dateInput">

      <label class="form-label" for="timeInput">Čas</label>
      <input type="time" class="form-control" id="timeInput">

      <label class="form-label" for="noteInput">Poznámka (nepovinné)</label>
      <input type="text" class="form-control" id="noteInput" placeholder="napr. stretnutie pri kaviarni…">

      <button class="btn-submit" id="btnSubmit" onclick="submitDate()">Potvrdiť termín 💌</button>
      <div class="error-msg" id="errorMsg">Prosím vyber dátum a čas 🌸</div>
    </div>

    <!-- PANEL 3: Processing -->
    <div id="panel3" class="slide-panel processing-panel">
      <span class="processing-icon">⏳</span>
      <p class="processing-text">Tvoja požiadavka sa spracováva&hellip;</p>
      <p class="processing-sub">Odosielam 💌</p>
    </div>

    <!-- PANEL 4: Confirmed -->
    <div id="panel4" class="slide-panel">
      <span style="font-size:2.5rem;display:block;margin-bottom:1rem;animation:heartbeat 2s ease-in-out infinite">😍</span>
      <p class="panel-title">Dohodnuté!</p>
      <p class="panel-sub" id="confirmedText">Teším sa na teba 🌸</p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
/* ====================================================
   CONFIGURATION — replace these values
   ====================================================
   1. Go to https://www.emailjs.com and create a free account
   2. Add an Email Service (Gmail, etc.) → copy the Service ID
   3. Create an Email Template with variables: {{date}}, {{time}}, {{note}}
      Set "To email" to YOUR email address in the template settings
   4. Copy your Public Key from Account → API Keys
   ==================================================== */
const EMAILJS_PUBLIC_KEY  = '_Lq0ruSSU-NzdMRWV';
const EMAILJS_SERVICE_ID  = 'service_yfug17q';
const EMAILJS_TEMPLATE_ID = 'template_bq7pyim';

emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

/* ---- Falling petals ---- */
const petalsBg = document.getElementById('petals');
const petalChars = ['🌸','🌺','✿','❀','🌷'];
for (let i = 0; i < 18; i++) {
  const p = document.createElement('span');
  p.className = 'petal';
  p.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.fontSize = (10 + Math.random() * 10) + 'px';
  p.style.animationDuration = (6 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  petalsBg.appendChild(p);
}

/* ---- "No" button dodging — stays within .buttons-area ---- */
const btnNo      = document.getElementById('btnNo');
const btnYes     = document.getElementById('btnYes');
const area       = document.getElementById('buttonsArea');

let dodgeEnabled = false;

// After first mousemove anywhere on the area, enable dodging and expand Yes
area.addEventListener('mousemove', () => {
  if (!dodgeEnabled) {
    dodgeEnabled = true;
    btnYes.classList.add('expanded');
  }
}, { once: true });

btnNo.addEventListener('mouseenter', dodge);
btnNo.addEventListener('mousemove', dodge);

function dodge() {
  if (!dodgeEnabled) return;

  const areaRect = area.getBoundingClientRect();
  const noRect   = btnNo.getBoundingClientRect();

  const areaW = areaRect.width;
  const areaH = areaRect.height;

  // Current center of No inside area
  const curCx = noRect.left + noRect.width  / 2 - areaRect.left;
  const curCy = noRect.top  + noRect.height / 2 - areaRect.top;

  const margin = 10;
  const halfW  = noRect.width  / 2 + margin;
  const halfH  = noRect.height / 2 + margin;

  const safeL = halfW;
  const safeR = areaW - halfW;
  const safeT = halfH;
  const safeB = areaH - halfH;

  if (safeR <= safeL || safeB <= safeT) return; // area too small — bail

  let newCx, newCy, tries = 0;
  do {
    newCx = safeL + Math.random() * (safeR - safeL);
    newCy = safeT + Math.random() * (safeB - safeT);
    tries++;
  } while (
    tries < 12 &&
    Math.abs(newCx - curCx) < noRect.width + 20 &&
    Math.abs(newCy - curCy) < noRect.height + 16
  );

  // Convert center → left/top (absolute inside area)
  btnNo.style.left      = newCx + 'px';
  btnNo.style.top       = newCy + 'px';
  btnNo.style.transform = 'translate(-50%, -50%)';
}

/* ---- Panel switching ---- */
function showPanel(id) {
  ['panel1','panel2','panel3','panel4'].forEach(pid => {
    const el = document.getElementById(pid);
    el.classList.remove('active');
    el.style.display = 'none';
  });
  const target = document.getElementById(id);
  target.style.display = 'block';
  requestAnimationFrame(() => target.classList.add('active'));
}

function showCalendar() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('dateInput').min = today;
  showPanel('panel2');
}

function setStep(n) {
  document.querySelectorAll('.step-dot').forEach((d, i) => {
    d.classList.toggle('active', i < n);
  });
}

/* ---- Submit ---- */
function submitDate() {
  const date = document.getElementById('dateInput').value;
  const time = document.getElementById('timeInput').value;
  const note = document.getElementById('noteInput').value.trim();
  const err  = document.getElementById('errorMsg');

  if (!date || !time) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  setStep(2);
  showPanel('panel3');

  const formatted = new Date(date + 'T' + time);
  const dateStr   = formatted.toLocaleDateString('sk-SK', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  const timeStr   = formatted.toLocaleTimeString('sk-SK', { hour:'2-digit', minute:'2-digit' });

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    date: dateStr,
    time: timeStr,
    note: note || '—'
  }).then(() => {
    document.getElementById('confirmedText').textContent = dateStr + ' o ' + timeStr + ' 🌸';
    setTimeout(() => showPanel('panel4'), 900);
  }).catch((e) => {
    console.error('EmailJS error:', e);
    document.getElementById('confirmedText').textContent = dateStr + ' o ' + timeStr + ' 🌸';
    setTimeout(() => showPanel('panel4'), 900);
  });
}

/* Init */
document.getElementById('panel1').style.display = 'block';
</script>
</body>
</html>
